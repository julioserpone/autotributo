# =============================================================================
# Autotributo — entorno local
# Equivalencia con Laravel Cloud:
#   Postgres 16  -> Serverless Postgres (Neon)
#   Valkey 8     -> Laravel Valkey
#   Disco local  -> Object Storage S3 (solo desarrollo; en Cloud, AWS S3)
#   Reverb       -> WebSocket cluster administrado
#   queue:work   -> Managed queue (SQS) / Worker cluster
#   schedule:work-> Scheduler toggle
# =============================================================================
name: autotributo

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
  image: autotributo/php:dev
  working_dir: /var/www/html
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
  volumes:
    - ./:/var/www/html:cached
  depends_on:
    db:
      condition: service_healthy
    valkey:
      condition: service_healthy
    mailpit:
      condition: service_started
  networks:
    - autotributo
  restart: unless-stopped

services:
  app:
    <<: *app
    container_name: autotributo-app
    command: ["php-fpm"]

  web:
    image: nginx:1.27-alpine
    container_name: autotributo-web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - autotributo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  queue:
    <<: *app
    container_name: autotributo-queue
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=sri,ai,reports,default
      - --tries=3
      - --backoff=10
      - --timeout=120
      - --max-time=3600
      - --verbose

  scheduler:
    <<: *app
    container_name: autotributo-scheduler
    command: ["php", "artisan", "schedule:work", "--verbose"]

  reverb:
    <<: *app
    container_name: autotributo-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"

  vite:
    image: node:24-alpine
    container_name: autotributo-vite
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html:cached
    command: sh -c "npm install --no-audit --no-fund --package-lock=false && rm -rf node_modules/.vite && npm run dev -- --host 0.0.0.0"
    environment:
      HOME: /tmp
      CHOKIDAR_USEPOLLING: "true"
      VITE_PORT: ${VITE_PORT:-5173}
      # URL pública del túnel; si está vacía, los assets apuntan a localhost.
      VITE_TUNNEL_URL: ${VITE_TUNNEL_URL:-}
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    networks:
      - autotributo
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: autotributo-db
    environment:
      POSTGRES_DB: autotributo
      POSTGRES_USER: autotributo
      POSTGRES_PASSWORD: secret
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotributo -d autotributo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - autotributo
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: autotributo-valkey
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6380:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - autotributo
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: autotributo-mailpit
    ports:
      # 8025/1025 suelen estar ocupados por otros stacks de correo locales.
      # Dentro de la red Docker el servicio sigue siendo mailpit:8025 y mailpit:1025.
      - "8026:8025"
      - "1026:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - autotributo
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:

networks:
  autotributo:
    driver: bridge
