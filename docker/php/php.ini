; Configuración PHP — desarrollo local
; Producción en Laravel Cloud se configura por variables del entorno y el
; runtime gestionado; este archivo NO se usa en Cloud.

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120

date.timezone = UTC
default_charset = "UTF-8"

; OPcache apagado en dev para reflejar cambios al instante.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

; Errores visibles en desarrollo.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Sesiones
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Subidas grandes de paquetes SRI (TXT/XML comprimidos)
max_file_uploads = 50

[opcache]
opcache.jit = off
