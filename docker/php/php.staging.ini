; Configuración PHP — staging en una sola EC2 (ADR-0008).
; El runtime de Laravel Cloud no usa este archivo.
;
; La instancia es una t3.micro con 1 GB de RAM: el límite de memoria se baja a
; 256 MB y PHP-FPM se limita a 4 workers. Los assets se compilan en el host, no
; aquí.

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
max_file_uploads = 50

date.timezone = UTC
default_charset = "UTF-8"
expose_php = Off

; OPcache activo: la imagen es inmutable y se reinicia en cada deploy.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off

; Nunca mostrar errores al cliente; todo va a stderr para que Docker/journald lo
; capture (LOG_CHANNEL=stderr en la aplicación).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
error_log = /proc/self/fd/2

; Cookies de sesión: HTTPS obligatorio en staging.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"

[opcache]
opcache.jit = off
