; Pool de PHP-FPM — desarrollo local
; Sin `user`/`group`: el contenedor corre con el UID/GID del host (docker-compose
; `user:`), lo que evita archivos root en el bind mount. PHP-FPM solo puede
; cambiar de usuario cuando el master corre como root.
[www]
listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

access.log = /proc/self/fd/2
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
