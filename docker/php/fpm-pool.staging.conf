; Pool de PHP-FPM — staging en t3.micro (1 GB de RAM).
;
; 4 workers como máximo: con 256 MB de memory_limit por request el peor caso
; agota la instancia, pero en la práctica el uso por request es mucho menor y
; hay 2 GB de swap. No subir `pm.max_children` sin subir la instancia.
[www]
listen = 0.0.0.0:9000
listen.backlog = 128

pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

; Un request colgado se corta a los 2 minutos.
request_terminate_timeout = 120s

access.log = /proc/self/fd/2
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
