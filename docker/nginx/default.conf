# Túnel de desarrollo: el servidor de Vite se sirve por el mismo origen público
# (VITE_TUNNEL_URL en docker-compose.yml). Así los assets no dependen de CORS ni
# del permiso de red local del navegador, y el HMR viaja por wss.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 64m;

    # Seguridad básica (Cloud aplica además su capa de edge)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets del servidor de Vite en desarrollo (incluye /@vite/client y el
    # WebSocket de HMR en /@vite-hmr).
    location ~ ^/(@vite|@fs|@id|resources/|node_modules/) {
        proxy_pass http://vite:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Archivos de Vite con hash: caché larga.
    location ~* ^/build/.*\.(js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
