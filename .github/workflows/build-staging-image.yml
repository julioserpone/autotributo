name: Build staging app image

# Construye y publica la imagen COMPLETA de staging (PHP + extensiones + codigo +
# assets compilados) en GHCR. La instancia efimera la descarga con docker pull y
# no necesita Node, npm ni composer (opcion E de docs/13).
#
# La imagen base de PHP se publica por separado (build-php-base.yml); este
# workflow la usa como FROM.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'resources/**'
      - 'routes/**'
      - 'database/**'
      - 'config/**'
      - 'bootstrap/**'
      - 'public/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'docker/php/Dockerfile'
      - '.github/workflows/build-staging-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: staging
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autotributo-staging:staging
            ghcr.io/${{ github.repository_owner }}/autotributo-staging:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/autotributo-php-base:8.5
          cache-from: type=gha
          cache-to: type=gha,mode=max
