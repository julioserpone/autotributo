name: Build staging image

# Construye y publica en GHCR las dos imágenes de staging (ADR-0008):
#
#   autotributo-php-base:8.5  -> toolchain: PHP 8.5 + extensiones + Composer +
#                                Node 24 + git + rsync. Es lo caro de construir
#                                (extensiones compiladas) y cambia solo cuando
#                                cambia docker/php/Dockerfile.
#   autotributo-staging:*     -> toolchain + código + vendor/ + public/build.
#                                Es el snapshot que descarga `create`.
#
# La instancia nunca compila extensiones ni instala Node/Composer: recibe
# actualizaciones (`apk upgrade`, `composer`, `npm run build` en caliente) sobre
# estas imágenes.
#
# Se ejecuta solo con CI verde en `main`: publicar antes de que CI pase dejaría
# la imagen con código roto y el siguiente `create` lo desplegaría. Para probar
# una rama usa `workflow_dispatch` (el job de CI también se exige).

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-staging-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve image prefixes
        id: image
        run: |
          echo "base=${{ env.REGISTRY }}/${{ github.repository_owner }}/autotributo-php-base" >> "$GITHUB_OUTPUT"
          echo "staging=${{ env.REGISTRY }}/${{ github.repository_owner }}/autotributo-staging" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Primero la base del mismo commit: así un cambio en el Dockerfile
      # (extensión nueva, versión de Node) no se queda huérfano y la imagen de
      # staging nunca construye el toolchain por segunda vez en el runner.
      - name: Build and push PHP base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: base
          push: true
          tags: |
            ${{ steps.image.outputs.base }}:8.5
            ${{ steps.image.outputs.base }}:${{ steps.revision.outputs.sha }}
          cache-from: |
            type=gha,scope=php-base
            type=registry,ref=${{ steps.image.outputs.base }}:8.5
          cache-to: type=gha,mode=max,scope=php-base

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: staging
          push: true
          tags: |
            ${{ steps.image.outputs.staging }}:staging
            ${{ steps.image.outputs.staging }}:${{ steps.revision.outputs.sha }}
          # `image-refresh.sh` y el diagnóstico usan la revisión; la instancia ya
          # no la necesita para elegir el código.
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.base }}:8.5
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
