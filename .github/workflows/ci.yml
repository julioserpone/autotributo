name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PHP_VERSION: "8.5"
  NODE_VERSION: "24"

# These job names are required status check contexts and must match
# .github/rulesets/main-protection.json. Keep them as literal strings:
# expressions such as `name: ${{ env.X }}` resolve to an empty context and the
# PR can never become mergeable.
#
# Playwright is NOT part of CI: it boots the whole Docker Compose stack, which is
# slow and costly on hosted runners. Run it locally with `make e2e` before
# merging UI changes (see CONTRIBUTING.md). Never add it back as a required check
# without a real need for it on the server.
jobs:
  backend:
    name: Backend (Pint, PHPStan, Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autotributo_test
          POSTGRES_USER: autotributo
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autotributo -d autotributo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: soap, sodium, pdo_pgsql, pgsql, redis, intl, bcmath, zip, gd, pcntl, pcov
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare test environment
        run: |
          cp .env.testing.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: Validate Composer
        run: composer validate --strict --no-check-publish

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests and coverage
        run: ./vendor/bin/pest --coverage --min=80

      - name: Dependency audit
        run: composer audit --no-interaction
  frontend:
    name: Frontend (types, lint, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit --run
      - run: npm run build
      - run: npm audit --audit-level=high

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  security:
    name: Security (secrets and dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
