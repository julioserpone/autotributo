name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PHP_VERSION: "8.5"
  NODE_VERSION: "24"
  # Job names are the required status check contexts of the main-protection
  # ruleset (.github/rulesets/main-protection.json). Rename both places together.
  CHECK_BACKEND: "Backend (Pint, PHPStan, Pest)"
  CHECK_FRONTEND: "Frontend (types, lint, Vitest, build)"
  CHECK_SECURITY: "Security (secrets and dependencies)"
  CHECK_WORKFLOWS: "Workflow lint (actionlint)"

jobs:
  # E2E (Playwright) runs locally against the Docker stack (`make e2e`) on
  # purpose: it boots the whole compose stack and is slow and costly on hosted
  # runners. If it is ever added back to CI, add its name to the ruleset too.
  backend:
    name: ${{ env.CHECK_BACKEND }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autotributo_test
          POSTGRES_USER: autotributo
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autotributo -d autotributo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: soap, sodium, pdo_pgsql, pgsql, redis, intl, bcmath, zip, gd, pcntl, pcov
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare test environment
        run: |
          cp .env.testing.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: Validate Composer
        run: composer validate --strict --no-check-publish

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests and coverage
        run: ./vendor/bin/pest --coverage --min=80

      - name: Dependency audit
        run: composer audit --no-interaction

  frontend:
    name: ${{ env.CHECK_FRONTEND }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build
      - run: npm audit --audit-level=high

  workflows:
    name: ${{ env.CHECK_WORKFLOWS }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  security:
    name: ${{ env.CHECK_SECURITY }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
