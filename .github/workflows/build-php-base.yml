name: Build PHP base image

# Construye y publica en GHCR la imagen base de PHP (toolchain) de staging
# (ver ADR-0008 y docs/13). Contiene PHP-FPM 8.5 + extensiones + Composer +
# Node + git + rsync: es lo que no debe compilarse en una t3.micro nunca más.
#
# `build-staging-image.yml` también la publica antes de la imagen completa; este
# workflow existe para poder refrescarla sola (por ejemplo, renovar Node o
# aplicar parches de las extensiones) sin esperar a CI completo.
#
# La imagen se publica como PUBLICA para que las instancias efimeras puedan
# hacer `docker pull` sin credenciales (capa gratuita e ilimitada de GHCR).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/php/Dockerfile'
      - '.github/workflows/build-php-base.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${{ github.repository_owner }}/autotributo-php-base" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: base
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:8.5
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            PHP_VERSION=8.5
          cache-from: type=gha
          cache-to: type=gha,mode=max
