name: Deploy staging

# Despliegue manual al staging de AWS (ADR-0008). No se dispara en cada push:
# el runbook pide validar antes de publicar. Cuando el entorno sea estable se
# puede añadir `push: branches: [main]`.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging (EC2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/staging_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/staging_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'cd /opt/autotributo && ./scripts/staging/deploy.sh'

      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --max-time 20 \
            "${STAGING_URL%/}/up" >/dev/null
